<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · Gerador de Relatórios LastOne</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap { width: 100%; max-width: 380px; padding: 20px; }
    .login-card { background: var(--paper); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 28px; }
    .login-logo { text-align: center; margin-bottom: 22px; }
    .login-logo img { height: 40px; }
    .login-card h1 { font-size: 18px; color: var(--forest); text-align: center; margin-bottom: 4px; }
    .login-card .lead { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 22px; }
    .login-card .field { margin-bottom: 14px; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 6px; }
    .login-err {
      background: #fdecea; border: 1px solid #f5c6c0; color: var(--danger);
      border-radius: 9px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; display: none;
    }
    .login-err.show { display: block; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><img src="/assets/logo.png" alt="LastOne" /></div>
      <h1>Entrar</h1>
      <p class="lead">Gerador de Relatórios · Google Ads</p>

      <div class="login-err" id="err"></div>

      <form id="loginForm">
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="email" placeholder="admin@lastone.com" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>
        <button class="btn btn-forest" id="submitBtn" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        errBox.textContent = data.error || 'Não foi possível entrar.';
        errBox.classList.add('show');
      } catch {
        errBox.textContent = 'Falha de conexão. Tente novamente.';
        errBox.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
  </script>
</body>
</html>
